    Projects:
      - name: Scable-dev
        summary: Scaling cable yarding for low-impact timber harvesting in France.
        highlights:
          - Macroeconomic impact of the national expansion of cable yarding on the forest-wood sector.
          - Comparison of the costs and availability of wood between harvesting methods.
          - Determinants of the costs and harvesting speed.
        start_date: 2025
        end_date: 2027
      - name: Dominos
        summary: Studying the determinants of the rise of a forest-based bioeconomy in France.
        highlights:
          - Attitudes and behaviors of the French people towards the use of wood for construction and energy.
          - Hierarchical cognitive modeling.
          - Discrete choice experiment.
        start_date: 2022
        end_date: 2027

